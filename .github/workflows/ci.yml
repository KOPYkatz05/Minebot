name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r requirements-reviewer.txt
      - run: python -m pip install --no-deps -e .
      - run: npm exec --yes --package=pnpm@10.6.5 -- pnpm --dir reviewer/frontend install --frozen-lockfile --ignore-scripts
      - run: npm exec --yes --package=pnpm@10.6.5 -- pnpm --dir reviewer/frontend run build
      - run: python tools/project.py doctor
      - run: python -m unittest discover -s tests -v
      - run: python -m minebot --help
      - name: Verify Codex cloud install script
        if: runner.os == 'Linux'
        run: bash scripts/setup-cloud.sh
